<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street City 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 12px;
      border-radius: 10px;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div id="info">
    <b>STREET CITY 3D</b><br>
    Explore the city
  </div>

  <div id="controls">
    WASD / Arrow Keys = Move
  </div>

  <script type="module">

    import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    // Scene
    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 6, 10);

    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document.body.appendChild(renderer.domElement);

    // Lighting
    const sunlight = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    sunlight.position.set(10, 20, 10);
    scene.add(sunlight);

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.6
    );

    scene.add(ambientLight);

    // Ground
    const groundGeometry =
      new THREE.PlaneGeometry(200, 200);

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3b6e3b
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.rotation.x = -Math.PI / 2;

    scene.add(ground);

    // Roads
    function createRoad(x, z, width, depth) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          0.1,
          depth
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: 0x333333
        });

      const road =
        new THREE.Mesh(
          geometry,
          material
        );

      road.position.set(
        x,
        0.05,
        z
      );

      scene.add(road);
    }

    createRoad(0, 0, 200, 12);
    createRoad(0, 0, 12, 200);

    // Buildings
    function createBuilding(x, z, width, height, depth) {

      const geometry =
        new THREE.BoxGeometry(
          width,
          height,
          depth
        );

      const material =
        new THREE.MeshStandardMaterial({
          color:
            Math.random() * 0xffffff
        });

      const building =
        new THREE.Mesh(
          geometry,
          material
        );

      building.position.set(
        x,
        height / 2,
        z
      );

      scene.add(building);
    }

    // City buildings
    for (let x = -60; x <= 60; x += 20) {

      for (let z = -60; z <= 60; z += 20) {

        if (
          Math.abs(x) < 15 ||
          Math.abs(z) < 15
        ) continue;

        const height =
          5 + Math.random() * 20;

        createBuilding(
          x,
          z,
          12,
          height,
          12
        );
      }
    }

    // Player
    const playerGeometry =
      new THREE.CapsuleGeometry(
        0.6,
        1.4,
        4,
        8
      );

    const playerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x2255ff
      });

    const player =
      new THREE.Mesh(
        playerGeometry,
        playerMaterial
      );

    player.position.set(
      0,
      1.4,
      5
    );

    scene.add(player);

    // Movement
    const keys = {};

    window.addEventListener(
      "keydown",
      event => {
        keys[event.key.toLowerCase()] = true;
      }
    );

    window.addEventListener(
      "keyup",
      event => {
        keys[event.key.toLowerCase()] = false;
      }
    );

    // Game loop
    function animate() {

      requestAnimationFrame(
        animate
      );

      const speed = 0.15;

      if (keys["w"] || keys["arrowup"]) {
        player.position.z -= speed;
      }

      if (keys["s"] || keys["arrowdown"]) {
        player.position.z += speed;
      }

      if (keys["a"] || keys["arrowleft"]) {
        player.position.x -= speed;
      }

      if (keys["d"] || keys["arrowright"]) {
        player.position.x += speed;
      }

      // Third-person camera
      camera.position.x =
        player.position.x;

      camera.position.z =
        player.position.z + 10;

      camera.position.y = 6;

      camera.lookAt(
        player.position
      );

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // Resize
    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
