<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street City 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0,0,0,.7);
      padding: 12px;
      border-radius: 12px;
    }

    #buttons {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: bold;
      color: white;
      background: #111827;
    }

    #driveControls {
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 10;
      display: none;
      gap: 8px;
    }

    #driveControls button {
      width: 55px;
      height: 55px;
      padding: 0;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div id="info">
    <b>STREET CITY 3D</b><br>
    <span id="status">Walk to the car</span>
  </div>

  <div id="buttons">
    <button id="enter">ENTER CAR</button>
    <button id="exit" style="display:none;">EXIT CAR</button>
  </div>

  <div id="driveControls">
    <button id="left">◀️</button>
    <button id="forward">▲</button>
    <button id="back">▼</button>
    <button id="right">▶️</button>
  </div>

  <script type="module">

    import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x87ceeb);

    // CAMERA
    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

    // RENDERER
    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document.body.appendChild(
      renderer.domElement
    );

    // LIGHT
    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    sun.position.set(
      20,
      30,
      10
    );

    scene.add(sun);

    scene.add(
      new THREE.AmbientLight(
        0xffffff,
        0.6
      )
    );

    // GROUND
    const ground =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          250,
          250
        ),
        new THREE.MeshStandardMaterial({
          color: 0x39733c
        })
      );

    ground.rotation.x =
      -Math.PI / 2;

    scene.add(ground);

    // ROADS
    function road(
      width,
      depth,
      x,
      z
    ) {

      const r =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            width,
            .12,
            depth
          ),
          new THREE.MeshStandardMaterial({
            color: 0x30343b
          })
        );

      r.position.set(
        x,
        .06,
        z
      );

      scene.add(r);
    }

    road(220, 14, 0, 0);
    road(14, 220, 0, 0);
    road(180, 10, 0, 55);
    road(10, 180, 55, 0);

    // BUILDINGS
    function building(
      x,
      z
    ) {

      const height =
        7 + Math.random() * 18;

      const b =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            12,
            height,
            12
          ),
          new THREE.MeshStandardMaterial({
            color:
              new THREE.Color(
                0.25 +
                Math.random() * .35,
                0.25 +
                Math.random() * .35,
                0.25 +
                Math.random() * .35
              )
          })
        );

      b.position.set(
        x,
        height / 2,
        z
      );

      scene.add(b);
    }

    for (
      let x = -80;
      x <= 80;
      x += 20
    ) {

      for (
        let z = -80;
        z <= 80;
        z += 20
      ) {

        if (
          Math.abs(x) < 18 ||
          Math.abs(z) < 18
        ) continue;

        building(x, z);
      }
    }

    // PLAYER
    const player =
      new THREE.Mesh(
        new THREE.CapsuleGeometry(
          .6,
          1.4,
          4,
          8
        ),
        new THREE.MeshStandardMaterial({
          color: 0x1769ff
        })
      );

    player.position.set(
      0,
      1.4,
      8
    );

    scene.add(player);

    // CAR
    const car =
      new THREE.Group();

    const body =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.2,
          .7,
          4
        ),
        new THREE.MeshStandardMaterial({
          color: 0xd62828
        })
      );

    body.position.y =
      .75;

    car.add(body);

    const roof =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.7,
          .6,
          1.9
        ),
        new THREE.MeshStandardMaterial({
          color: 0x222222
        })
      );

    roof.position.set(
      0,
      1.25,
      -.2
    );

    car.add(roof);

    // WHEELS
    function wheel(
      x,
      z
    ) {

      const w =
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .38,
            .38,
            .25,
            16
          ),
          new THREE.MeshStandardMaterial({
            color: 0x111111
          })
        );

      w.rotation.z =
        Math.PI / 2;

      w.position.set(
        x,
        .42,
        z
      );

      car.add(w);
    }

    wheel(-1.15, -1.3);
    wheel(1.15, -1.3);
    wheel(-1.15, 1.3);
    wheel(1.15, 1.3);

    car.position.set(
      4,
      0,
      7
    );

    scene.add(car);

    // GAME STATE
    let driving = false;
    let speed = 0;
    let steering = 0;

    const keys = {};

    window.addEventListener(
      "keydown",
      e => {
        keys[e.key.toLowerCase()] = true;
      }
    );

    window.addEventListener(
      "keyup",
      e => {
        keys[e.key.toLowerCase()] = false;
      }
    );

    // BUTTONS
    const enter =
      document.getElementById(
        "enter"
      );

    const exit =
      document.getElementById(
        "exit"
      );

    const controls =
      document.getElementById(
        "driveControls"
      );

    const status =
      document.getElementById(
        "status"
      );

    enter.onclick = () => {

      const distance =
        player.position.distanceTo(
          car.position
        );

      if (distance < 7) {

        driving = true;

        player.visible = false;

        enter.style.display =
          "none";

        exit.style.display =
          "block";

        controls.style.display =
          "flex";

        status.textContent =
          "Driving!";

      } else {

        status.textContent =
          "Walk closer to the car.";

      }
    };

    exit.onclick = () => {

      driving = false;

      player.visible = true;

      player.position.copy(
        car.position
      );

      player.position.x += 3;

      exit.style.display =
        "none";

      enter.style.display =
        "block";

      controls.style.display =
        "none";

      status.textContent =
        "You're walking.";

    };

    // TOUCH CONTROLS
    function hold(
      button,
      key
    ) {

      button.addEventListener(
        "touchstart",
        e => {
          e.preventDefault();
          keys[key] = true;
        }
      );

      button.addEventListener(
        "touchend",
        e => {
          e.preventDefault();
          keys[key] = false;
        }
      );

      button.addEventListener(
        "mousedown",
        () => {
          keys[key] = true;
        }
      );

      button.addEventListener(
        "mouseup",
        () => {
          keys[key] = false;
        }
      );
    }

    hold(
      document.getElementById("forward"),
      "w"
    );

    hold(
      document.getElementById("back"),
      "s"
    );

    hold(
      document.getElementById("left"),
      "a"
    );

    hold(
      document.getElementById("right"),
      "d"
    );

    // GAME LOOP
    function animate() {

      requestAnimationFrame(
        animate
      );

      if (driving) {

        if (
          keys["w"] ||
          keys["arrowup"]
        ) {
          speed += .008;
        }

        if (
          keys["s"] ||
          keys["arrowdown"]
        ) {
          speed -= .008;
        }

        speed *= .96;

        if (
          keys["a"] ||
          keys["arrowleft"]
        ) {
          car.rotation.y += .035;
        }

        if (
          keys["d"] ||
          keys["arrowright"]
        ) {
          car.rotation.y -= .035;
        }

        car.translateZ(
          -speed
        );

      } else {

        const walk =
          .15;

        if (
          keys["w"] ||
          keys["arrowup"]
        )
          player.position.z -= walk;

        if (
          keys["s"] ||
          keys["arrowdown"]
        )
          player.position.z += walk;

        if (
          keys["a"] ||
          keys["arrowleft"]
        )
          player.position.x -= walk;

        if (
          keys["d"] ||
          keys["arrowright"]
        )
          player.position.x += walk;
      }

      // CAMERA
      const target =
        driving
          ? car.position
          : player.position;

      const cameraTarget =
        new THREE.Vector3(
          target.x,
          target.y + 1,
          target.z
        );

      camera.position.lerp(
        new THREE.Vector3(
          target.x,
          target.y + 6,
          target.z + 10
        ),
        .08
      );

      camera.lookAt(
        cameraTarget
      );

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    // RESIZE
    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
